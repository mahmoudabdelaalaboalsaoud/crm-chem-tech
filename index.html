<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة العملاء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F2F8;--surface:#fff;--fg:#1E1A2B;--muted:#625B75;--line:#E1DCEB;--accent:#5E2B8A;--on:#fff;--soft:#ECE9F3;--bad:#9A2F1F;--bad-bg:#F9E0DA;--shadow:0 1px 3px #1e1a2b14;
--c-new:#5E2B8A;--c-int:#176E62;--c-quo:#946000;--c-neg:#B5541A;--c-won:#17653D;--c-lost:#9A2F1F;--c-x:#625B75;--font:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#14111C;--surface:#1D1928;--fg:#ECE8F5;--muted:#A79FBD;--line:#342E45;--accent:#B58BE0;--on:#1A0F26;--soft:#2A2438;--bad:#F3A294;--bad-bg:#40201B;--shadow:none;
--c-new:#B58BE0;--c-int:#5CC7B5;--c-quo:#E3B341;--c-neg:#F0A070;--c-won:#7FD8A4;--c-lost:#F3A294;--c-x:#A79FBD;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--font);padding:0 max(14px,env(safe-area-inset-right)) 48px max(14px,env(safe-area-inset-left))}
#app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.35rem;margin:0}h2{font-size:1.05rem;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.btn{padding:.55rem 1rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.btn.s{padding:.35rem .8rem;font-size:.88rem}
:focus-visible{outline:3px solid var(--c-int);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;cursor:pointer;text-align:start;box-shadow:var(--shadow);font-size:.85rem;color:var(--muted)}
.stat b{display:block;font-size:1.6rem;line-height:1.2;color:var(--fg)}
.stat.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:2 1 180px}.tools select{flex:1 1 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card.c{border-inline-start:5px solid var(--sc)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc);display:grid;place-items:center;font-weight:700;flex:none}
.pill{padding:.05rem .7rem;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--soft)}
.pill.st{background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.pill.late{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted);font-size:.9rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
dialog{width:min(560px,calc(100% - 20px));border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);padding:16px;max-height:92vh}
dialog::backdrop{background:#0009}
form{display:flex;flex-direction:column;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{border-inline-start:3px solid var(--accent);padding:2px 10px;margin:6px 0}
.hide{display:none}#msg{color:var(--bad);min-height:1.4em}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
@media(max-width:420px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== الإعدادات =====
const SUPABASE_URL = 'https://ovhyefrscxqniaeeomiq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92aHllZnJzY3hxbmlhZWVvbWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwOTc3MDEsImV4cCI6MjEwNjY3MzcwMX0.jx2en8f6TcbMQ_v7RvRdhvQ1jN-ePSi92VpK25dogOI';
const COUNTRY_CODE = '20';
// =====================
const BASE_ST = ['جديد','مهتم','عرض سعر','تفاوض','تم البيع','خسارة'];
const BASE_TY = ['مكالمة','زيارة','واتساب','إيميل'];
const SC = {'جديد':'new','مهتم':'int','عرض سعر':'quo','تفاوض':'neg','تم البيع':'won','خسارة':'lost'};
const col = s => `var(--c-${SC[s]||'x'})`;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s), app = $('#app'), dlg = $('#dlg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
let customers = [], view = 'all', q = '', st = '';
const allSt = () => [...new Set([...BASE_ST, ...customers.map(c => c.status).filter(Boolean)])];
const wa = p => { let d = String(p||'').replace(/\D/g,''); if(d.startsWith('0')) d = COUNTRY_CODE + d.slice(1); return 'https://wa.me/' + d; };
const selNew = (name, list, val, what) => `<select name="${name}" data-new>${list.map(s => `<option ${s===val?'selected':''}>${esc(s)}</option>`).join('')}<option value="__new">＋ إضافة ${what} جديدة…</option></select><input name="${name}_new" class="hide" placeholder="اكتب ${what} الجديدة" maxlength="40">`;
const pick = (v, k) => { if(v[k]==='__new') v[k] = (v[k+'_new']||'').trim() || null; delete v[k+'_new']; };

dlg.addEventListener('change', e => {
  if(!e.target.matches('select[data-new]')) return;
  const i = e.target.nextElementSibling, on = e.target.value === '__new';
  i.classList.toggle('hide', !on); if(on) i.focus();
});

async function boot(){ const { data:{ session } } = await sb.auth.getSession(); session ? loadAll() : loginView(); }

function loginView(msg=''){
  app.innerHTML = `<div class="top"><div class="brand"><div class="logo">CT</div><h1>متابعة العملاء</h1></div></div>
  <form id="lf" class="card"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label>
  <label>كلمة المرور<input name="pw" type="password" minlength="6" required autocomplete="current-password"></label>
  <div id="msg">${esc(msg)}</div><div class="acts"><button class="btn p">دخول</button></div></form>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email:f.get('email'), password:f.get('pw') });
    error ? loginView(error.message) : loadAll(); };
}

async function loadAll(){
  const { data, error } = await sb.from('customers').select('*').order('next_follow_up',{ascending:true,nullsFirst:false});
  if(error){ app.innerHTML = `<div class="card">تعذر تحميل البيانات: ${esc(error.message)}</div>`; return; }
  customers = data; render();
}

function render(){
  const t = today(), open = c => !['تم البيع','خسارة'].includes(c.status);
  const due = c => c.next_follow_up && c.next_follow_up <= t && open(c);
  const late = c => c.next_follow_up && c.next_follow_up < t && open(c);
  const list = customers.filter(c => (view==='all' || (view==='due' && due(c)) || (view==='won' && c.status==='تم البيع')) && (!st || c.status===st) &&
    (!q || [c.name,c.company,c.phone,c.city].some(v => (v||'').toLowerCase().includes(q.toLowerCase()))));
  const stat = (k,n,l,c) => `<button class="stat ${view===k?'on':''}" data-v="${k}"><b style="color:${c||'var(--fg)'}">${n}</b>${l}</button>`;
  app.innerHTML = `<div class="top"><div class="brand"><div class="logo">CT</div><h1>متابعة العملاء</h1></div>
  <div class="acts"><button class="btn p" id="add">+ عميل</button><button class="btn" id="im">استيراد</button><button class="btn" id="xl">تصدير Excel</button><input type="file" id="fi" class="hide" accept=".xlsx,.xls,.csv"><button class="btn" id="out">خروج</button></div></div>
  <div class="stats">${stat('all',customers.length,'كل العملاء')}${stat('due',customers.filter(due).length,'متابعات مستحقة','var(--c-neg)')}${stat('won',customers.filter(c=>c.status==='تم البيع').length,'تم البيع','var(--c-won)')}</div>
  <div class="tools"><input id="q" type="search" placeholder="ابحث بالاسم أو الشركة أو الهاتف" value="${esc(q)}"><select id="st"><option value="">كل الحالات</option>${allSt().map(s=>`<option ${s===st?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
  ${list.length ? list.map(c => `<div class="card c" style="--sc:${col(c.status)}"><div class="row"><div class="who"><div class="av">${esc([...(c.name||'?')][0])}</div><div><h2>${esc(c.name)}</h2><span class="muted">${esc([c.company,c.city].filter(Boolean).join(' - '))}</span></div></div>
    <span class="pill st">${esc(c.status)}</span></div>
    <div class="row"><span class="muted" dir="ltr">${esc(c.phone)}</span>${c.next_follow_up?`<span class="pill ${late(c)?'late':''}">متابعة: ${c.next_follow_up}${late(c)?' (متأخرة)':''}</span>`:''}</div>
    <div class="acts">${c.phone?`<a class="btn s" href="tel:${esc(c.phone)}">اتصال</a><a class="btn s" target="_blank" rel="noopener" href="${wa(c.phone)}">واتساب</a>`:''}<button class="btn s p" data-id="${c.id}">فتح وتسجيل متابعة</button></div></div>`).join('')
    : '<div class="card empty">لا يوجد عملاء هنا.<br>اضغط "+ عميل" لإضافة أول عميل.</div>'}`;
  $('#add').onclick = () => openCustomer();
  $('#xl').onclick = exportXlsx; $('#im').onclick = () => $('#fi').click(); $('#fi').onchange = importFile;
  $('#out').onclick = async () => { await sb.auth.signOut(); customers = []; loginView(); };
  $('#q').oninput = e => { q = e.target.value; render(); const i = $('#q'); i.focus(); i.setSelectionRange(q.length,q.length); };
  $('#st').onchange = e => { st = e.target.value; render(); };
  app.querySelectorAll('.stat').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => openCustomer(b.dataset.id));
}

async function importFile(e){
  const f = e.target.files[0]; if(!f) return;
  if(!window.XLSX) return alert('مكتبة Excel لم تتحمل. تأكد من الإنترنت.');
  try{
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'', raw:false });
    const g = (r,k) => String(r[k] ?? '').trim();
    const seen = new Set(customers.map(c => c.name + '|' + (c.city||'')));
    const out = []; let skip = 0;
    for(const r of rows){
      const name = g(r,'الاسم'); if(!name) continue;
      const city = g(r,'المدينة');
      if(seen.has(name+'|'+city)){ skip++; continue; }
      seen.add(name+'|'+city);
      const d = g(r,'المتابعة القادمة');
      out.push({ name, company:g(r,'الشركة')||null, city:city||null, phone:g(r,'الهاتف')||null, status:g(r,'الحالة')||'جديد',
        next_follow_up:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:null, notes:g(r,'ملاحظات')||null });
    }
    if(!out.length) return alert(skip ? 'كل العملاء موجودون بالفعل ('+skip+').' : 'لم أجد صفوفًا صالحة. تأكد من عناوين الأعمدة (الاسم، المدينة، الحالة...).');
    if(!confirm('سيتم استيراد '+out.length+' عميل'+(skip?' (وتخطي '+skip+' مكرر)':'')+'. متابعة؟')) return;
    const r = await sb.from('customers').insert(out);
    if(r.error) return alert('تعذر الاستيراد: '+r.error.message);
    alert('تم استيراد '+out.length+' عميل ✅'); loadAll();
  }catch(err){ alert('تعذر قراءة الملف: '+err.message); }
  finally{ e.target.value = ''; }
}

async function exportXlsx(){
  if(!window.XLSX) return alert('مكتبة Excel لم تتحمل. تأكد من الإنترنت وحاول مرة أخرى.');
  const r = await sb.from('interactions').select('*').order('created_at',{ascending:false});
  const names = Object.fromEntries(customers.map(c => [c.id, c.name]));
  const s1 = customers.map(c => ({'الاسم':c.name,'الشركة':c.company,'المدينة':c.city,'الهاتف':c.phone,'الحالة':c.status,'المتابعة القادمة':c.next_follow_up,'ملاحظات':c.notes,'تاريخ الإضافة':(c.created_at||'').slice(0,10)}));
  const s2 = (r.data||[]).map(l => ({'العميل':names[l.customer_id]||'','النوع':l.type,'التفاصيل':l.note,'التاريخ':(l.created_at||'').slice(0,10)}));
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views:[{ RTL:true }] };
  const a = XLSX.utils.json_to_sheet(s1), b = XLSX.utils.json_to_sheet(s2);
  a['!cols'] = [{wch:22},{wch:20},{wch:14},{wch:16},{wch:12},{wch:16},{wch:30},{wch:14}];
  b['!cols'] = [{wch:22},{wch:12},{wch:40},{wch:14}];
  XLSX.utils.book_append_sheet(wb, a, 'العملاء'); XLSX.utils.book_append_sheet(wb, b, 'سجل المتابعات');
  XLSX.writeFile(wb, 'customers-' + today() + '.xlsx');
}

async function openCustomer(id){
  const c = customers.find(x => x.id===id) || {};
  let logs = [];
  if(id){ const r = await sb.from('interactions').select('*').eq('customer_id',id).order('created_at',{ascending:false}); logs = r.data || []; }
  const types = [...new Set([...BASE_TY, ...logs.map(l => l.type).filter(Boolean)])];
  dlg.innerHTML = `<form id="cf"><h2>${id?'بيانات العميل':'عميل جديد'}</h2>
  <label>الاسم<input name="name" required value="${esc(c.name)}"></label>
  <div class="g2"><label>الشركة<input name="company" value="${esc(c.company)}"></label><label>المدينة<input name="city" value="${esc(c.city)}"></label>
  <label>الهاتف<input name="phone" type="tel" dir="ltr" value="${esc(c.phone)}"></label><label>الحالة${selNew('status', allSt(), c.status||'جديد', 'حالة')}</label></div>
  <label>موعد المتابعة القادمة<input name="next_follow_up" type="date" value="${c.next_follow_up||''}"></label>
  <label>ملاحظات<textarea name="notes" rows="2">${esc(c.notes)}</textarea></label>
  <div class="acts"><button class="btn p">حفظ</button><button class="btn" type="button" id="cl">إغلاق</button>${id?'<button class="btn s" type="button" id="del" style="margin-inline-start:auto;color:var(--bad)">حذف العميل</button>':''}</div></form>
  ${id?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><form id="lg"><h2>تسجيل متابعة</h2>
  <div class="g2"><label>النوع${selNew('type', types, types[0], 'نوع')}</label><label>المتابعة القادمة<input name="next" type="date"></label></div>
  <label>ماذا حدث؟<textarea name="note" rows="2" required></textarea></label><button class="btn p">إضافة للسجل</button></form>
  <div>${logs.map(l=>`<div class="log"><b>${esc(l.type)}</b> <span class="muted">${new Date(l.created_at).toLocaleDateString('ar-EG')}</span><div>${esc(l.note)}</div></div>`).join('')||'<p class="muted">لا يوجد سجل متابعات بعد.</p>'}</div>`:''}`;
  dlg.showModal();
  $('#cl').onclick = () => dlg.close();
  $('#cf').onsubmit = async e => { e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target)); pick(v,'status'); v.status = v.status || 'جديد'; v.next_follow_up = v.next_follow_up || null;
    const r = id ? await sb.from('customers').update(v).eq('id',id) : await sb.from('customers').insert(v);
    if(r.error) return alert('تعذر الحفظ: '+r.error.message); dlg.close(); loadAll(); };
  if(id){
    $('#del').onclick = async () => { if(!confirm('حذف العميل وكل سجله نهائياً؟')) return; await sb.from('customers').delete().eq('id',id); dlg.close(); loadAll(); };
    $('#lg').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); pick(f,'type');
      const r = await sb.from('interactions').insert({ customer_id:id, type:f.type || 'مكالمة', note:f.note });
      if(r.error) return alert('تعذر الحفظ: '+r.error.message);
      if(f.next) await sb.from('customers').update({ next_follow_up:f.next }).eq('id',id);
      dlg.close(); await loadAll(); openCustomer(id); };
  }
}
boot();
</script>
</body>
</html>
