<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة العملاء</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F7F6FA;--surface:#fff;--fg:#1E1A2B;--muted:#625B75;--line:#DDD8E8;--accent:#5E2B8A;--on:#fff;--teal:#176E62;--bad:#9A2F1F;--bad-bg:#F9E0DA;--ok:#17653D;--ok-bg:#DDF2E5;--soft:#ECE9F3;--font:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#14111C;--surface:#1D1928;--fg:#ECE8F5;--muted:#A79FBD;--line:#342E45;--accent:#B58BE0;--on:#1A0F26;--teal:#5CC7B5;--bad:#F3A294;--bad-bg:#40201B;--ok:#7FD8A4;--ok-bg:#16352A;--soft:#2A2438;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--font);padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));padding-top:max(16px,env(safe-area-inset-top))}
#app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.1rem;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.btn{padding:.55rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.btn.s{padding:.3rem .7rem;font-size:.88rem}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;cursor:pointer;text-align:start}
.stat b{display:block;font-size:1.6rem;line-height:1.2}
.stat.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:2 1 180px}.tools select{flex:1 1 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pill{padding:.05rem .65rem;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--soft)}
.pill.late{background:var(--bad-bg);color:var(--bad)}.pill.won{background:var(--ok-bg);color:var(--ok)}
.muted{color:var(--muted);font-size:.9rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
dialog{width:min(560px,calc(100% - 24px));border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:16px;max-height:92vh}
dialog::backdrop{background:#0008}
form{display:flex;flex-direction:column;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{border-inline-start:3px solid var(--accent);padding:2px 10px;margin:6px 0}
#msg{color:var(--bad);min-height:1.4em}
@media(max-width:420px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== الإعدادات: ضع بيانات مشروعك من Supabase > Project Settings > API =====
const SUPABASE_URL = 'https://ovhyefrscxqniaeeomiq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IZOI-f85WV6ScLaOfykMmA_Z05hGHdM';
const COUNTRY_CODE = '20'; // كود الدولة لواتساب (مصر 20، السعودية 966 ...)
// ==========================================================================
const STATUSES = ['جديد','مهتم','عرض سعر','تفاوض','تم البيع','خسارة'];
const TYPES = ['مكالمة','زيارة','واتساب','إيميل'];
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s), app = $('#app'), dlg = $('#dlg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
let customers = [], view = 'all', q = '', st = '';

function wa(p){ let d = String(p||'').replace(/\D/g,''); if(d.startsWith('0')) d = COUNTRY_CODE + d.slice(1); return 'https://wa.me/' + d; }

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  session ? loadAll() : loginView();
}

function loginView(msg=''){
  app.innerHTML = `<h1>متابعة العملاء</h1>
  <form id="lf" class="card"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label>
  <label>كلمة المرور<input name="pw" type="password" minlength="6" required autocomplete="current-password"></label>
  <div id="msg">${esc(msg)}</div>
  <div class="acts"><button class="btn p">دخول</button><button class="btn" type="button" id="su">إنشاء حساب</button></div></form>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email:f.get('email'), password:f.get('pw') });
    error ? loginView('بيانات الدخول غير صحيحة') : loadAll(); };
  $('#su').onclick = async () => { const f = new FormData($('#lf'));
    if(!f.get('email') || !f.get('pw')) return loginView('اكتب البريد وكلمة المرور (6 أحرف على الأقل)');
    const { data, error } = await sb.auth.signUp({ email:f.get('email'), password:f.get('pw') });
    if(error) return loginView(error.message);
    data.session ? loadAll() : loginView('تم إنشاء الحساب. أكد بريدك ثم سجّل الدخول.'); };
}

async function loadAll(){
  const { data, error } = await sb.from('customers').select('*').order('next_follow_up',{ascending:true,nullsFirst:false});
  if(error){ app.innerHTML = `<div class="card">تعذر تحميل البيانات: ${esc(error.message)}<br>تأكد أنك شغّلت ملف supabase.sql.</div>`; return; }
  customers = data; render();
}

function render(){
  const t = today();
  const due = c => c.next_follow_up && c.next_follow_up <= t && !['تم البيع','خسارة'].includes(c.status);
  const late = c => c.next_follow_up && c.next_follow_up < t && !['تم البيع','خسارة'].includes(c.status);
  const list = customers.filter(c =>
    (view==='all' || (view==='due' && due(c)) || (view==='won' && c.status==='تم البيع')) &&
    (!st || c.status===st) &&
    (!q || [c.name,c.company,c.phone,c.city].some(v => (v||'').toLowerCase().includes(q.toLowerCase()))));
  const stat = (k,n,l) => `<button class="stat ${view===k?'on':''}" data-v="${k}"><b>${n}</b>${l}</button>`;
  app.innerHTML = `<div class="bar"><h1>متابعة العملاء</h1><div class="acts"><button class="btn p" id="add">+ عميل</button><button class="btn" id="out">خروج</button></div></div>
  <div class="stats">${stat('all',customers.length,'كل العملاء')}${stat('due',customers.filter(due).length,'متابعات اليوم والمتأخرة')}${stat('won',customers.filter(c=>c.status==='تم البيع').length,'تم البيع')}</div>
  <div class="tools"><input id="q" type="search" placeholder="ابحث بالاسم أو الشركة أو الهاتف" value="${esc(q)}"><select id="st"><option value="">كل الحالات</option>${STATUSES.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></div>
  ${list.length ? list.map(c => `<div class="card"><div class="row"><div><h2>${esc(c.name)}</h2><span class="muted">${esc([c.company,c.city].filter(Boolean).join(' - '))}</span></div>
    <span class="pill ${c.status==='تم البيع'?'won':''}">${esc(c.status)}</span></div>
    <div class="row"><span class="muted" dir="ltr">${esc(c.phone)}</span>${c.next_follow_up?`<span class="pill ${late(c)?'late':''}">متابعة: ${c.next_follow_up}${late(c)?' (متأخرة)':''}</span>`:''}</div>
    <div class="acts">${c.phone?`<a class="btn s" href="tel:${esc(c.phone)}">اتصال</a><a class="btn s" target="_blank" rel="noopener" href="${wa(c.phone)}">واتساب</a>`:''}<button class="btn s p" data-id="${c.id}">فتح وتسجيل متابعة</button></div></div>`).join('')
    : '<div class="card muted">لا يوجد عملاء هنا. اضغط "+ عميل" لإضافة أول عميل.</div>'}`;
  $('#add').onclick = () => openCustomer();
  $('#out').onclick = async () => { await sb.auth.signOut(); customers = []; loginView(); };
  $('#q').oninput = e => { q = e.target.value; render(); $('#q').focus(); $('#q').setSelectionRange(q.length,q.length); };
  $('#st').onchange = e => { st = e.target.value; render(); };
  app.querySelectorAll('.stat').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => openCustomer(b.dataset.id));
}

async function openCustomer(id){
  const c = customers.find(x => x.id===id) || {};
  let logs = [];
  if(id){ const r = await sb.from('interactions').select('*').eq('customer_id',id).order('created_at',{ascending:false}); logs = r.data || []; }
  const opt = (arr,v) => arr.map(s => `<option ${s===v?'selected':''}>${s}</option>`).join('');
  dlg.innerHTML = `<form id="cf"><h2>${id?'بيانات العميل':'عميل جديد'}</h2>
  <label>الاسم<input name="name" required value="${esc(c.name)}"></label>
  <div class="g2"><label>الشركة<input name="company" value="${esc(c.company)}"></label><label>المدينة<input name="city" value="${esc(c.city)}"></label>
  <label>الهاتف<input name="phone" type="tel" dir="ltr" value="${esc(c.phone)}"></label><label>الحالة<select name="status">${opt(STATUSES,c.status||'جديد')}</select></label></div>
  <label>موعد المتابعة القادمة<input name="next_follow_up" type="date" value="${c.next_follow_up||''}"></label>
  <label>ملاحظات<textarea name="notes" rows="2">${esc(c.notes)}</textarea></label>
  <div class="acts"><button class="btn p">حفظ</button><button class="btn" type="button" id="cl">إغلاق</button>${id?'<button class="btn s" type="button" id="del" style="margin-inline-start:auto;color:var(--bad)">حذف العميل</button>':''}</div></form>
  ${id?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><form id="lg"><h2>تسجيل متابعة</h2>
  <div class="g2"><label>النوع<select name="type">${opt(TYPES)}</select></label><label>المتابعة القادمة<input name="next" type="date"></label></div>
  <label>ماذا حدث؟<textarea name="note" rows="2" required></textarea></label><button class="btn p">إضافة للسجل</button></form>
  <div>${logs.map(l=>`<div class="log"><b>${esc(l.type)}</b> <span class="muted">${new Date(l.created_at).toLocaleDateString('ar-EG')}</span><div>${esc(l.note)}</div></div>`).join('')||'<p class="muted">لا يوجد سجل متابعات بعد.</p>'}</div>`:''}`;
  dlg.showModal();
  $('#cl').onclick = () => dlg.close();
  $('#cf').onsubmit = async e => { e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target)); v.next_follow_up = v.next_follow_up || null;
    const r = id ? await sb.from('customers').update(v).eq('id',id) : await sb.from('customers').insert(v);
    if(r.error) return alert('تعذر الحفظ: '+r.error.message); dlg.close(); loadAll(); };
  if(id){
    $('#del').onclick = async () => { if(!confirm('حذف العميل وكل سجله نهائياً؟')) return; await sb.from('customers').delete().eq('id',id); dlg.close(); loadAll(); };
    $('#lg').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      const r = await sb.from('interactions').insert({ customer_id:id, type:f.type, note:f.note });
      if(r.error) return alert('تعذر الحفظ: '+r.error.message);
      if(f.next) await sb.from('customers').update({ next_follow_up:f.next }).eq('id',id);
      dlg.close(); await loadAll(); openCustomer(id); };
  }
}
boot();
</script>
</body>
</html>
